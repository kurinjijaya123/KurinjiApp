
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Kurinji.xcodeproj \
            -scheme Kurinji \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Show compiler errors
        if: failure()
        run: |
          echo "===== XCODE COMPILER ERRORS ====="
          grep -n -E 'error:|fatal error:|BUILD FAILED' xcodebuild.log | head -100 || true

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kurinji-Xcode-Diagnostic-Log
          path: xcodebuild.log
          if-no-files-found: warn
