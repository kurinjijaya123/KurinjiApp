name: Kurinji

options:
  deploymentTarget:
    iOS: "17.0"

targets:
  Kurinji:
    type: application
    platform: iOS

    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/inventory.db
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kurinji.inventory
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
